name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Restore signing key
        env: { KS: '${{ secrets.TREZVO_KEYSTORE_B64 }}' }
        run: |
          mkdir -p keystore
          echo "$KS" | base64 -d > keystore/trezvo.keystore
      - name: Build signed APK
        env: { TREZVO_KS_PASS: '${{ secrets.TREZVO_KS_PASS }}' }
        run: |
          ./gradlew assembleRelease --no-daemon
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk trezvy-vecher-$V.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs trezvy-vecher-$V.apk | head -2
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" -t "Трезвый вечер ${TAG#v}" -F .github/release-notes.md
          gh release upload "$TAG" trezvy-vecher-*.apk --clobber
