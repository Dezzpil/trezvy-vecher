name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - name: Restore signing key
        env: { KS: '${{ secrets.TREZVO_KEYSTORE_B64 }}' }
        run: |
          mkdir -p keystore
          echo "$KS" | base64 -d > keystore/trezvo.keystore
      - name: Build signed APK
        env: { TREZVO_KS_PASS: '${{ secrets.TREZVO_KS_PASS }}' }
        run: |
          ./gradlew assembleRelease --no-daemon
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk trezvy-vecher-$V.apk
          CERT=$($ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs trezvy-vecher-$V.apk)
          echo "$CERT" | head -2
          if echo "$CERT" | grep -q "CN=Android Debug"; then echo "::error::APK подписан debug-ключом — проверь секреты TREZVO_KEYSTORE_B64 / TREZVO_KS_PASS"; exit 1; fi
          T=${GITHUB_REF_NAME#v}; if [ "$GITHUB_REF_TYPE" = tag ] && [ "$T" != "$V" ]; then echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName $V"; exit 1; fi
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" -t "Трезвый вечер ${TAG#v}" -F .github/release-notes.md
          gh release upload "$TAG" trezvy-vecher-*.apk --clobber
