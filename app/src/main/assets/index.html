<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Трезвый вечер</title>
<style>
:root{
 --bg:#0f1d1a;--bg2:#0b1714;--card:#172d28;--card2:#1f3b34;--line:#2a4840;--tx:#eef2ee;--mut:#9fb3aa;--acc:#e8c77a;--ok:#7cc59a;--bad:#e58b7a;
 --s-body:#ef8f7c;--s-hands:#e8c77a;--s-mind:#8fb4e8;--s-people:#d39be0;--s-world:#7cc59a;--s-quiet:#7fd1d1;--s-shift:#b7b7a4;
 --r:18px;--btn:48px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom));overflow-x:hidden}
h1{font-size:22px;margin:0;font-weight:700}h2{font-size:17px;margin:0 0 10px;font-weight:700}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mut);font-size:14px}.small{font-size:13px}.mut{color:var(--mut)}
.wrap{padding:0 14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
header.page{padding:20px 18px 6px}
/* ---------- кнопки: одна высота, без переносов ---------- */
button{font:inherit;border:0;border-radius:14px;height:var(--btn);padding:0 14px;background:var(--card2);color:var(--tx);width:100%;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;justify-content:center;gap:8px;
 transition:transform .12s var(--ease),background .2s,color .2s,opacity .2s;cursor:pointer;min-width:0}
button:active{transform:scale(.96)}
button.pri{background:var(--acc);color:#1b1b12;font-weight:700}
button.ok{background:var(--ok);color:#10201c;font-weight:700}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
button.danger{background:#5a2c26}
button.icon{width:var(--btn);flex:0 0 var(--btn);padding:0}
button.link{background:none;height:auto;padding:6px 2px;color:var(--mut);font-size:14px;width:auto;text-decoration:underline;text-underline-offset:3px}
button.tiny{height:34px;border-radius:10px;font-size:14px;padding:0 12px;width:auto}
.btns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px}
.btns.c3{grid-template-columns:1fr 1fr 1.35fr;grid-auto-flow:row}
.btns.c2{grid-template-columns:1fr 1.4fr;grid-auto-flow:row}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.o3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.o1{grid-template-columns:1fr}
.opt{height:44px;border-radius:12px;font-size:15px;background:var(--card2)}
.opt.on{background:var(--acc);color:#1b1b12;font-weight:600}
/* горизонтальная лента чипов: всегда в одну строку */
.scroller{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 14px 6px;margin:0 -14px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:auto;height:40px;border-radius:999px;padding:0 15px;font-size:15px;background:var(--card2);scroll-snap-align:start}
.chip.on{background:var(--tx);color:#10201c;font-weight:600}
textarea,input[type=text],input[type=time],input[type=number]{width:100%;background:#0c1916;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}
input[type=time]{height:var(--btn);padding:0 10px;color-scheme:dark}
textarea{min-height:76px;resize:none}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
label.f{display:block;margin:16px 0 8px;color:var(--mut);font-size:14px}
.tip{background:var(--card2);border-left:4px solid var(--acc);border-radius:10px;padding:11px 12px;margin:10px 0;font-size:15px}
.warn{background:#3a2420;border-radius:12px;padding:12px;font-size:14px}
.hide{display:none!important}
.rowline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:56px}
.rowline:last-child{border:0}
.rowline.r3{grid-template-columns:1fr 104px 44px}
.switch{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;margin:0}
.switch:checked{background:var(--ok)}.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch:checked::after{transform:translateX(18px)}
/* ---------- навигация ---------- */
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(11,23,20,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;backdrop-filter:blur(8px)}
nav button{background:none;border-radius:0;height:64px;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
nav button svg{width:22px;height:22px;transition:transform .25s var(--spring)}
nav button.on{color:var(--acc)}nav button.on svg{transform:translateY(-2px) scale(1.08)}
/* ---------- переходы ---------- */
.view{animation:vin .32s var(--ease) both}
.view.back{animation-name:vback}
@keyframes vin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes vback{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,199,122,.5)}100%{box-shadow:0 0 0 14px rgba(232,199,122,0)}}
.rise{animation:rise .35s var(--ease) both}
/* ---------- верх: колесо равновесия ---------- */
.top{display:grid;grid-template-columns:136px 1fr;gap:12px;align-items:center;padding:16px 14px 4px}
.wheel svg{width:136px;height:136px;display:block;overflow:visible}
.petal{transform-box:view-box;transform-origin:70px 70px;transition:transform .8s var(--spring)}
.petal-bg{opacity:.14}
.wl{font-size:9.5px;fill:var(--mut);text-anchor:middle;dominant-baseline:middle}
.wl.has{fill:var(--tx)}
.wheel.pulse svg{animation:pop .6s var(--ease)}
.topinfo .eq{font-size:15px;color:var(--mut)}.topinfo .eq b{font-size:34px;color:var(--tx);line-height:1;margin-right:2px}
.topinfo .miss{font-size:14px;margin-top:6px;line-height:1.35}
.topinfo .stk{font-size:13px;color:var(--mut);margin-top:8px}
.loadbar{height:6px;border-radius:3px;background:#0c1916;margin-top:8px;overflow:hidden}.loadbar div{height:100%;background:linear-gradient(90deg,var(--ok),var(--acc),var(--bad));transition:width .6s var(--ease)}
/* ---------- линия дня ---------- */
.line{position:relative;padding:4px 14px 10px 14px}
.line::before{content:'';position:absolute;left:31px;top:0;bottom:0;width:2px;background:var(--line)}
.li{position:relative;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:7px 0;min-height:40px}
.li .dot{width:12px;height:12px;border-radius:50%;margin:6px 0 0 12px;background:var(--mut);box-shadow:0 0 0 4px var(--bg);position:relative;z-index:1}
.li .dot.hollow{background:var(--bg);border:2px solid var(--mut)}
.li .tm{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.li .tx{font-size:15px;line-height:1.35}
.li .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:nowrap}
.li.future{opacity:.75}.li.future .dot{background:var(--bg);border:2px dashed var(--mut)}
.li.new{animation:rise .5s var(--ease) both}.li.new .dot{animation:glow 1.2s ease-out 2}
.li.place .tx{color:var(--mut);font-size:13px}.li.place .dot{width:8px;height:8px;margin:8px 0 0 14px}
.daysep{margin:12px 0 2px 46px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
/* узел «сейчас» */
.now{position:relative;margin:6px 0 6px;padding-left:0}
.now .nowdot{position:absolute;left:10px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px var(--bg);z-index:1;animation:glow 2s ease-out infinite}
.now .nowbody{margin-left:46px}
.nowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:12px;padding:3px;width:230px;height:40px}
.seg button{background:none;height:34px;border-radius:10px;font-size:14px;color:var(--mut);position:relative;z-index:1}
.seg button.on{color:#1b1b12;font-weight:600}
.seg .ind{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:34px;border-radius:10px;background:var(--acc);transition:transform .3s var(--ease)}
.seg.r .ind{transform:translateX(100%)}
.pull{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;margin-top:6px;height:40px}
.pull b{font-variant-numeric:tabular-nums;text-align:right}
.pull input{accent-color:var(--bad)}
.wants{overflow:hidden;transition:max-height .35s var(--ease),opacity .3s;max-height:0;opacity:0}
.wants.open{max-height:420px;opacity:1}
.wants .scroller{margin:0;padding:2px 0 6px}
.plt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.plt input{width:auto;min-width:120px;height:44px}
/* ---------- карточка хода ---------- */
.mv{position:relative;background:var(--card);border-radius:var(--r);padding:16px;margin-top:10px;border-top:4px solid var(--sc,var(--acc));
 transition:transform .22s var(--ease),opacity .22s var(--ease);will-change:transform}
.mv.out{transform:translateX(-40px) rotate(-1.5deg);opacity:0}
.mv.in{animation:cin .34s var(--ease) both}
@keyframes cin{from{transform:translateX(40px) rotate(1.5deg);opacity:0}to{transform:none;opacity:1}}
.mv.go{animation:pop .4s var(--ease)}
.mv .meta{display:flex;align-items:center;gap:8px;height:28px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:#10201c;background:var(--sc);white-space:nowrap}
.mv .meta .sub{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mv .more{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:none;color:var(--mut);padding:0}
.mv h2{font-size:20px;margin:8px 0 6px}
.mv .why{font-size:13px;color:var(--mut);margin-top:10px;display:flex;gap:6px;align-items:center}
.mv .why i{width:8px;height:8px;border-radius:50%;background:var(--sc);display:inline-block;flex:0 0 8px}
.steps{list-style:none;padding:0;margin:12px 0 0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);animation:rise .35s var(--ease) both}
.steps li .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--mut);transition:background .2s,border-color .2s}
.steps li.on .ck{background:var(--ok);border-color:var(--ok)}
.steps li.on span{color:var(--mut);text-decoration:line-through}
.ring{display:grid;place-items:center;margin:14px auto 0;width:120px;height:120px;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--sc,var(--acc));stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring b{font-size:26px;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.badge{font-size:12px;color:var(--sc);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.mv.shift{--sc:var(--s-shift)}
.nowlinks{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;height:40px}
.nowlinks .tgl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.flyer{position:fixed;width:18px;height:18px;border-radius:50%;z-index:50;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:#10201c;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .3s var(--ease);z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- нижняя панель ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .28s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
 transform:translateY(105%);transition:transform .34s var(--ease);z-index:41}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-open .backdrop{opacity:1}.sheet-open .sheet{transform:none}
/* ---------- прочее ---------- */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 b{display:block;font-size:28px;color:var(--acc)}.stat3 span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:#0c1916;border-radius:4px;overflow:hidden;margin-top:4px}.bar div{height:100%;background:var(--acc);transition:width .6s var(--ease)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days div{aspect-ratio:1;border-radius:7px;background:#0c1916;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.days .s{background:#2f6b4e;color:#fff}.days .d{background:#6b3a2f;color:#fff}.days .c{outline:2px solid var(--acc)}
.dayrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow svg{width:52px;height:52px}
.lib{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lib .t{font-size:15px}.lib .m{font-size:12px;color:var(--mut)}
.rec{display:flex;gap:10px;align-items:center;height:var(--btn)}.rec .dot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:blink 1s infinite;flex:0 0 12px}
@keyframes blink{50%{opacity:.2}}
.timer{font-size:54px;text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body></html>
